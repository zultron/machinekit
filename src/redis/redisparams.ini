[EMC]
# enable redis-specific logging
DEBUG=0x00080000  #EMC_DEBUG_REDIS

[RS274NGC]

# this turns on mirroring/retrieving numbered params from redis
# currently this is params 5610 - 5710, see emc/rs274/interp_internal.hh
REDIS_PARAMS=1
# do the emc.var job through redis
REDIS_PERSISTENCE=1

LOG_LEVEL=5

# the following client options are understood but are optional
#[REDIS]
#HOST=127.0.0.1
#PORT=6739
#PASSWORD=notsetbydefault
#TIMEOUT=1.5  #seconds to connect to redis server

# the following options override defaults for
# redis server startup from the linuxcnc script:
#SERVER_PATH=redis-server
#SERVER_LOG=/tmp/redis.log
#SERVER_ARGS=
#DISABLE_SERVER=1