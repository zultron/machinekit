[EMC]
DEBUG = 0x0

[DISPLAY]
DISPLAY = ./test-ui.py

[TASK]
TASK = milltask
CYCLE_TIME = 0.01

[RS274NGC]
PARAMETER_FILE = param.tmp.var
RS274NGC_STARTUP_CODE = G7 G18 G90 G64
USER_M_PATH = ../
SUBROUTINE_PATH = ../

FEATURE_LATHE_TOOLCHANGE = 1
FEATURE_EXTENDED_ERROR_MESSAGES = 1

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 4.0
COMM_WAIT = 0.010
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[HAL]
HALUI = halui
HALFILE = core_sim.hal
HALFILE = sim_spindle_core.hal

[TRAJ]
NO_FORCE_HOMING=1
AXES =                  3
COORDINATES =           X Z
HOME =                  0 0
LINEAR_UNITS =          inch
ANGULAR_UNITS =         degree
CYCLE_TIME =            0.010
DEFAULT_VELOCITY =      1.2
MAX_LINEAR_VELOCITY =   4

[AXIS_0]
TYPE =             LINEAR
HOME =             0.000
MAX_VELOCITY =     2
MAX_ACCELERATION = 100.0
BACKLASH =         0.000
INPUT_SCALE =      4000
OUTPUT_SCALE =     1.000
MIN_LIMIT =        -40.0
MAX_LIMIT =        40.0
FERROR =           0.050
MIN_FERROR =       0.010

[AXIS_2]
TYPE =             LINEAR
HOME =             0.0
MAX_VELOCITY =     2
MAX_ACCELERATION = 100.0
BACKLASH =         0.000
INPUT_SCALE =      4000
OUTPUT_SCALE =     1.000
MIN_LIMIT =        -40.0
MAX_LIMIT =        40.0
FERROR =           0.050
MIN_FERROR =       0.010

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = sim.tmp.tbl
TOOL_CHANGE_QUILL_UP = 1
RANDOM_TOOLCHANGER = 0

[REDIS]
DISABLE_SERVER = 1

